<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CityNexus · 智慧交通指揮中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/frontend/css/chat-variables.css" />
  <link rel="stylesheet" href="/frontend/css/styles.css" />
  <link rel="stylesheet" href="/frontend/css/chat-panel.css" />
  <link rel="stylesheet" href="/frontend/css/chat-messages.css" />
  <link rel="stylesheet" href="/frontend/css/chat-cards.css" />
  <link rel="stylesheet" href="/frontend/css/chat-input.css" />
  <link rel="stylesheet" href="/frontend/css/chat-loading.css" />
</head>
<body>
  <!-- Header -->
  <header id="header">
    <div class="header-left">
      <div class="header-title">CityNexus</div>
      <div class="header-subtitle">Traffic Command Center</div>
    </div>
    <div class="header-right">
      <div class="header-indicator">
        <span class="status-dot"></span>
        <span id="header-mode">System Online</span>
      </div>
      <div class="header-clock" id="header-time"></div>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="layout">
    <!-- Left Column -->
    <div class="col-left">
      <!-- KPI Row -->
      <section class="section" id="f1-kpi">
        <div class="kpi-card" data-kpi="active_incident_count"></div>
        <div class="kpi-card" data-kpi="current_level"></div>
        <div class="kpi-card" data-kpi="average_saturation"></div>
        <div class="kpi-card" data-kpi="multilingual_alert_count"></div>
        <div class="kpi-card" data-kpi="system_mode"></div>
      </section>

      <!-- Chart -->
      <section class="section card" id="f1-charts">
        <div class="section-header">Traffic Flow</div>
      </section>

      <!-- Road Network -->
      <section class="section card" id="f4-map">
        <div class="section-header">Road Network Topology</div>
      </section>
    </div>

    <!-- Right Column -->
    <div class="col-right">
      <!-- Event Injection -->
      <section class="section card" id="f3-inject">
        <div class="section-header">Event Injection</div>
        <form id="incident-inject-form"></form>
      </section>

      <!-- Decision Trace -->
      <section class="section card" id="f7-decision-basis">
        <nav class="f7-tabs">
          <button data-tab="activity" class="active">Activity</button>
          <button data-tab="basis">Decision Basis</button>
        </nav>
        <div id="f7-activity-feed" data-tab-panel="activity"></div>
        <div id="f7-basis-detail" data-tab-panel="basis" hidden></div>
      </section>

      <!-- Advisory Report -->
      <section class="section card" id="f5-report">
        <div class="section-header">Advisory Report</div>
        <div id="f5-report-content"></div>
      </section>
    </div>
  </div>

  <!-- Alert Modal -->
  <div id="f2-alert-modal" hidden></div>

  <!-- Chat Panel -->
  <button id="chat-toggle-btn" class="chat-fab">💬</button>
  <div id="chat-panel" class="chat-panel collapsed">
    <div class="chat-resize-handle"></div>
    <div class="chat-header" id="chat-header"></div>
    <div class="chat-status-banner" id="status-banner"></div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-quick-questions" id="chat-quick-questions"></div>
    <div class="chat-input-area" id="chat-input-area"></div>
  </div>

  <script src="/frontend/js/chat-utils.js"></script>
  <script src="/frontend/js/chat-state.js"></script>
  <script src="/frontend/js/chat-render.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/ws.js"></script>
  <script src="/frontend/vendor/chart.umd.js"></script>
  <script src="/frontend/js/charts.js"></script>
  <script src="/frontend/js/map.js"></script>
  <script src="/frontend/js/chat-app.js"></script>
  <script src="/frontend/js/app.js"></script>
</body>
</html>
